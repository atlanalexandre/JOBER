name: Veille du code

# ═══════════════════════════════════════════════════════════════════════════
# Contrôle déterministe — à chaque poussée sur main et sur chaque pull request,
# gratuit, immédiat, bloquant. Il vérifie les règles de CLAUDE.md, qui viennent
# toutes de pannes réelles. Il ne se trompe pas : il ne signale que ce qu'il
# peut prouver.
#
# La relecture IA quotidienne qui tournait ici a été retirée le 28/09/2026 à la
# demande d'Alexandre : elle ne lui servait pas. Elle est remplacée par une
# session Claude Code planifiée chaque jour à 6 h (Paris), qui relit la veille
# et les chemins d'argent, rejoue la recette complète, corrige par pull request
# — sans jamais fusionner — et lui envoie un résumé. Voir CLAUDE.md §4bis.
# ═══════════════════════════════════════════════════════════════════════════

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  coherence:
    name: Cohérence — règles CLAUDE.md
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Contrôle de cohérence
        run: node .github/scripts/coherence.cjs
