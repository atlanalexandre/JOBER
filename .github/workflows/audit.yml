name: Audit quotidien

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # tous les jours à 6h UTC (8h Paris)
  workflow_dispatch:

jobs:
  audit:
    name: Audit statique
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run audit
        id: audit
        run: |
          set +e
          OUTPUT=$(node .github/scripts/audit.cjs 2>&1)
          EXIT_CODE=$?
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "status=$([ $EXIT_CODE -eq 0 ] && echo 'OK' || echo 'ERREURS')" >> $GITHUB_OUTPUT
          echo "$OUTPUT"
          exit $EXIT_CODE

      - name: Envoyer rapport par email
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          AUDIT_OUTPUT: ${{ steps.audit.outputs.output }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          AUDIT_EXIT:   ${{ steps.audit.outputs.exit_code }}
        run: |
          STATUS_EMOJI=$([ "$AUDIT_EXIT" = "0" ] && echo "OK" || echo "ERREURS")
          STATUS_COLOR=$([ "$AUDIT_EXIT" = "0" ] && echo "#10D98F" || echo "#FF3B30")
          STATUS_ICON=$([ "$AUDIT_EXIT" = "0" ] && echo "&#x2705;" || echo "&#x1F534;")
          DATE=$(date '+%d/%m/%Y a %Hh%M')
          FROM="${RESEND_FROM:-ALANE Audit <no-reply@alane.fr>}"

          # Convertit le texte brut en HTML de façon sécurisée via Python
          HTML_BODY=$(python3 - <<'PYEOF'
import os, html
output = os.environ.get('AUDIT_OUTPUT', '')
lines = output.splitlines()
result = []
for line in lines:
    escaped = html.escape(line)
    if '&#x2705;' in escaped or 'OK' in escaped or escaped.startswith('✅'):
        color = '#10D98F'
    elif '❌' in escaped or 'erreur' in escaped.lower():
        color = '#FF3B30'
    elif '⚠' in escaped:
        color = '#FFD60A'
    else:
        color = 'rgba(255,255,255,0.85)'
    result.append(f'<p style="margin:2px 0;font-size:13px;font-family:monospace;color:{color}">{escaped}</p>')
print(''.join(result))
PYEOF
)

          SUBJECT="${STATUS_ICON} Audit ALANE - ${AUDIT_STATUS} - ${DATE}"

          # Construit le JSON via Python pour éviter les problèmes d'échappement
          python3 - <<PYEOF2
import os, json, urllib.request, urllib.error

api_key = os.environ['RESEND_API_KEY']
from_addr = os.environ.get('RESEND_FROM', 'ALANE Audit <no-reply@alane.fr>')
status_color = '${STATUS_COLOR}'
status_icon = '${STATUS_ICON}'
status = '${AUDIT_STATUS}'
date = '${DATE}'
html_body = """${HTML_BODY}"""

html_content = f"""
<div style="font-family:-apple-system,sans-serif;max-width:600px;margin:0 auto;background:#050E20;color:#fff;border-radius:12px;overflow:hidden">
  <div style="background:{status_color};padding:16px 24px">
    <h2 style="margin:0;font-size:18px">{status_icon} Audit ALANE &mdash; {status}</h2>
    <p style="margin:4px 0 0;opacity:0.85;font-size:13px">{date} &middot; Branche main</p>
  </div>
  <div style="padding:20px 24px;background:#0D1B3E">{html_body}</div>
  <div style="padding:12px 24px;background:#050E20;font-size:11px;color:rgba(255,255,255,0.35)">Rapport généré automatiquement &middot; alane.fr</div>
</div>
"""

payload = json.dumps({
    "from": from_addr,
    "to": ["direction@alane.fr"],
    "subject": f"{status_icon} Audit ALANE - {status} - {date}",
    "html": html_content
}).encode('utf-8')

req = urllib.request.Request(
    "https://api.resend.com/emails",
    data=payload,
    headers={"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"},
    method="POST"
)
try:
    with urllib.request.urlopen(req) as resp:
        print(f"Email envoyé avec succès: {resp.status} {resp.read().decode()}")
except urllib.error.HTTPError as e:
    print(f"Erreur Resend {e.code}: {e.read().decode()}")
    exit(1)
PYEOF2
