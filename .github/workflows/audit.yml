name: Audit quotidien

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"  # tous les jours à 6h UTC (8h Paris)
  workflow_dispatch:

jobs:
  audit:
    name: Audit statique
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Run audit
        id: audit
        run: |
          set +e
          OUTPUT=$(node .github/scripts/audit.cjs 2>&1)
          EXIT_CODE=$?
          echo "output<<EOF" >> $GITHUB_OUTPUT
          echo "$OUTPUT" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT
          echo "status=$([ $EXIT_CODE -eq 0 ] && echo 'OK' || echo 'ERREURS')" >> $GITHUB_OUTPUT
          echo "$OUTPUT"
          exit $EXIT_CODE

      - name: Envoyer rapport par email
        if: always()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          RESEND_FROM: ${{ secrets.RESEND_FROM }}
          AUDIT_OUTPUT: ${{ steps.audit.outputs.output }}
          AUDIT_STATUS: ${{ steps.audit.outputs.status }}
          AUDIT_EXIT:   ${{ steps.audit.outputs.exit_code }}
        run: |
          python3 <<'EOF'
import os, json, html, urllib.request, urllib.error
from datetime import datetime

api_key   = os.environ.get('RESEND_API_KEY', '')
from_addr = os.environ.get('RESEND_FROM', 'ALANE Audit <no-reply@alane.fr>')
output    = os.environ.get('AUDIT_OUTPUT', '')
status    = os.environ.get('AUDIT_STATUS', 'INCONNU')
exit_code = os.environ.get('AUDIT_EXIT', '1')

ok = exit_code == '0'
status_color = '#10D98F' if ok else '#FF3B30'
status_icon  = '✅' if ok else '🔴'
date_str = datetime.now().strftime('%d/%m/%Y à %Hh%M')

lines = output.splitlines()
html_lines = []
for line in lines:
    esc = html.escape(line)
    if line.startswith('✅') or line.startswith('OK'):
        color = '#10D98F'
    elif line.startswith('❌') or 'erreur' in line.lower():
        color = '#FF3B30'
    elif line.startswith('⚠'):
        color = '#FFD60A'
    elif line.startswith('═'):
        color = 'rgba(255,255,255,0.3)'
    else:
        color = 'rgba(255,255,255,0.8)'
    html_lines.append(
        f'<p style="margin:1px 0;font-size:12px;font-family:monospace;color:{color}">{esc}</p>'
    )
html_body = ''.join(html_lines)

html_content = f"""<div style="font-family:-apple-system,sans-serif;max-width:600px;margin:0 auto;background:#050E20;color:#fff;border-radius:12px;overflow:hidden">
<div style="background:{status_color};padding:16px 24px">
<h2 style="margin:0;font-size:18px">{status_icon} Audit ALANE — {status}</h2>
<p style="margin:4px 0 0;opacity:0.85;font-size:13px">{date_str} · Branche main</p>
</div>
<div style="padding:20px 24px;background:#0D1B3E">{html_body}</div>
<div style="padding:12px 24px;background:#050E20;font-size:11px;color:rgba(255,255,255,0.35)">Rapport généré automatiquement · alane.fr</div>
</div>"""

payload = json.dumps({
    "from": from_addr,
    "to": ["direction@alane.fr"],
    "subject": f"{status_icon} Audit ALANE — {status} — {date_str}",
    "html": html_content
}).encode('utf-8')

req = urllib.request.Request(
    "https://api.resend.com/emails",
    data=payload,
    headers={"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"},
    method="POST"
)
try:
    with urllib.request.urlopen(req) as resp:
        print(f"Email envoyé: {resp.status} {resp.read().decode()}")
except urllib.error.HTTPError as e:
    body = e.read().decode()
    print(f"Erreur Resend {e.code}: {body}")
    raise
EOF
